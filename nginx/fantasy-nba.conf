# ==============================================================================
# Fantasy NBA — Nginx 反向代理配置
# 路由规则：
#   /api/... → 剥除 /api 前缀 → http://api:3001/...  (NestJS)
#   /        →                → http://web:80/        (React 静态服务)
#
# api / web 均为 docker-compose 服务名，Docker 内网 DNS 自动解析
# ==============================================================================

upstream api_backend {
    server api:3001;
    keepalive 32;
}

upstream web_frontend {
    server web:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 安全响应头
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── API 路由：/api/... → api 容器（剥除 /api 前缀）────────────────────
    # proxy_pass 末尾 / 使 Nginx 将 location 前缀替换为 /
    # 示例：GET /api/auth/login → GET /auth/login → api:3001
    location /api/ {
        proxy_pass http://api_backend/;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── 前端路由：/ → web 容器（React SPA 静态服务）────────────────────────
    location / {
        proxy_pass http://web_frontend/;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout  5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
